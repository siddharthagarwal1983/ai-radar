[project]
name = "ai-radar"
version = "0.1.0"
description = "Daily voice-AI news digest, ranked against a personal interest profile"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.55",
    "google-auth>=2.35",   # Vertex AI via Application Default Credentials
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",  # FastAPI Form() support
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
ai-radar = "ai_radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer and FastAPI both document calling Option()/Depends()/Form() in the signature.
"src/ai_radar/cli.py" = ["B008"]
"src/ai_radar/web/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
